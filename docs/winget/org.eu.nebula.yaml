# Winget Manifest Draft for Nebula VPN Desktop Client
# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.6.0.schema.json

PackageIdentifier: org.eu.nebula
PackageVersion: 1.2.1
PackageName: Nebula VPN
Publisher: Nebula
PublisherUrl: https://github.com/org-eu-nebula/nebula
Author: Nebula Project
Moniker: nebula
ShortDescription: High-performance, highly customizable universal VPN and proxy desktop client.
Description: |
  Nebula is a modern desktop proxy and VPN client powered by sing-box.
  Supports VLESS Reality, VMess, Trojan, Shadowsocks, Hysteria2, and TUIC.
  Features custom themes, glassmorphism, wallpaper dimming, real-time latency sparklines,
  system proxy and TUN modes, and anti-censorship TLS fragmentation.
